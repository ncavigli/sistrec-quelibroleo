[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sistrec"
version = "0.1.0"
description = "Sistema de recomendación de libros (quelibroleo.com) - FCEN DM Sistemas de Recomendación 2026"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pyarrow",
    "implicit",
    "lightgbm",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
